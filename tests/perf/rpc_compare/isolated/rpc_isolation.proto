syntax = "proto2";
package rpc_isolation;
option cc_generic_services = true;
message Request { required bytes payload = 1; }
message Reply {
    required bytes payload = 1;
    required uint64 handler_ns = 2;
}
service EchoService { rpc Echo(Request) returns (Reply); }
