apiVersion: v1
kind: Pod
metadata:
  name: podName
spec:
  nodeName: nodeName
  restartPolicy: Never
  containers:
    - name: containerName
      image: imageName
      imagePullPolicy: Never
      command: ["/bin/sh", "-c", "exec sleep infinity"]
      resources:
        requests:
          cpu: "requests_cpu"
          memory: "requests_memory"
        limits:
          cpu: "limits_cpu"
          memory: "limits_memory"
      env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
